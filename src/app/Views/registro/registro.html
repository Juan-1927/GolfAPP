<div class="contenedor">
  <mat-card class="tarjeta">
    <mat-card-header>
      <mat-card-title>Crear cuenta</mat-card-title>
    </mat-card-header>

    <form [formGroup]="registroForm" (ngSubmit)="registrar()">
      <mat-card-content>
        <mat-form-field class="campo">
          <mat-label>Usuario</mat-label>
          <input matInput formControlName="usuario">
          @if (registroForm.controls['usuario'].hasError('required')) {
            <mat-error>El usuario es <strong>requerido</strong></mat-error>
          }
        </mat-form-field>

        <mat-form-field class="campo">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" formControlName="contrasena">
          @if (registroForm.controls['contrasena'].hasError('required')) {
            <mat-error>La contraseña es <strong>requerida</strong></mat-error>
          }
        </mat-form-field>
      </mat-card-content>

      <mat-card-actions>
        <button mat-raised-button color="primary" type="submit" [disabled]="registroForm.invalid">Registrarme</button>
      </mat-card-actions>
    </form>

    <p class="enlace-login">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </mat-card>
</div>
