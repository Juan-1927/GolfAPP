<div class="contenedor">
  <mat-card class="tarjeta">
    <mat-card-header>
      <mat-card-title>Iniciar sesión</mat-card-title>
    </mat-card-header>

    <form [formGroup]="loginForm" (ngSubmit)="ingresar()">
      <mat-card-content>
        <mat-form-field class="campo">
          <mat-label>Usuario</mat-label>
          <input matInput formControlName="usuario">
          @if (loginForm.controls['usuario'].hasError('required')) {
            <mat-error>El usuario es <strong>requerido</strong></mat-error>
          }
        </mat-form-field>

        <mat-form-field class="campo">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" formControlName="contrasena">
          @if (loginForm.controls['contrasena'].hasError('required')) {
            <mat-error>La contraseña es <strong>requerida</strong></mat-error>
          }
        </mat-form-field>
      </mat-card-content>

      <mat-card-actions>
        <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid">Ingresar</button>
      </mat-card-actions>
    </form>
  </mat-card>
</div>
