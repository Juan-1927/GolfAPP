<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #drawer
    class="sidenav"
    fixedInViewport
    [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
    [mode]="(isHandset$ | async) ? 'over' : 'side'"
    [opened]="(isHandset$ | async) === false">
    
    <mat-toolbar>Menu</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/palos">Palos</a>
      <a mat-list-item routerLink="/equipos">Equipos</a>
      <a mat-list-item routerLink="/vestimenta">Vestimenta</a>
      
      <div mat-subheader style="margin-top: 10px; font-weight: bold; color: #666;">GESTIÓN</div>
      <a mat-list-item routerLink="/formulario" style="padding-left: 25px;">Formulario</a>
      <a mat-list-item routerLink="/tabla" style="padding-left: 25px;">Tabla de palos</a>

      <a mat-list-item routerLink="/login" style="margin-top: 10px;">Iniciar sesión</a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar style="background-color: #3f51b5; color: white;">
      @if (isHandset$ | async) {
        <button
          type="button"
          aria-label="Toggle sidenav"
          mat-icon-button
          (click)="drawer.toggle()">
          <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
        </button>
      }
      <span>GolfAPP</span>
    </mat-toolbar>
    
    <!-- Este router-outlet carga la vista seleccionada en la pantalla principal -->
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
